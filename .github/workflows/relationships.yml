name: Collect Company Relationships
on:
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [incremental, backfill]
        default: incremental
      months:
        type: number
        default: 24
permissions:
  contents: write
concurrency:
  group: earnings-calendar-update
  cancel-in-progress: false
jobs:
  collect:
    if: vars.RELATIONSHIPS_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest tests/relationships -q
      - run: python -m relationships_py validate-config
      - name: Restore primary-document cache (never public site content)
        uses: actions/cache@v4
        with:
          path: .cache/relationships/documents
          key: relationship-documents-${{ github.run_id }}
          restore-keys: relationship-documents-
      - name: Collect and extract candidates
        id: collect
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          COLLECTION_MODE: ${{ inputs.mode || 'incremental' }}
          BACKFILL_MONTHS: ${{ inputs.months || 24 }}
        run: |
          python -m relationships_py collect-round --mode "$COLLECTION_MODE" --months "$BACKFILL_MONTHS"
      - name: Publish complete official announcements and validate the map
        id: publish
        run: python -m relationships_py auto-publish
      - name: Persist collection state and published map
        if: steps.publish.outcome == 'success'
        run: bash scripts/commit-generated.sh relationships_data output_json/relationships
      - name: Attach unresolved candidate queue and publication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-review-${{ github.run_id }}
          path: |
            relationships_data/review/candidates.jsonl
            relationships_data/review/report.md
            relationships_data/review/changes.json
            relationships_data/review/statements.json
            relationships_data/state/collection_round.json
            relationships_data/state/collection_runs
            relationships_data/state/automatic_publication.json
          retention-days: 14
      - name: Record collection and publication status
        if: always()
        env:
          EXPORT_OUTCOME: ${{ steps.publish.outcome }}
        run: python scripts/relationships-summary.py
