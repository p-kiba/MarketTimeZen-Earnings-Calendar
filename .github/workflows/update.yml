name: Auto Update Earnings Calendar

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: earnings-calendar-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Update Earnings JSON
        run: python earnings_py/main.py

      - name: Run generate_html.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python generate_html.py

      - name: Run generate_html_jp.py
        run: python generate_html_jp.py

      - name: Commit & Push changes
        run: |
          python scripts/build-calendar-universe.py
          bash scripts/commit-generated.sh \
            index.html earnings_data.json japan.html earnings_data_jp.json \
            earnings_history_jp.json output_json/earnings \
            earnings_py/input/earnings_index.json assets/relationships/calendar-universe.json assets/relationships/logos.json
