name: Auto Update Earnings Calendar

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pandas requests yfinance openpyxl beautifulsoup4

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Update Earnings JSON
        run: python earnings_py/main.py

      - name: Run generate_html.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python generate_html.py

      - name: Run generate_html_jp.py
        run: python generate_html_jp.py

      - name: Commit & Push changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add \
            index.html \
            earnings_data.json \
            japan.html \
            earnings_data_jp.json \
            output_json/earnings \
            earnings_py/input/earnings_index.json
          git commit -m "Auto update HTML & JSON $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push
